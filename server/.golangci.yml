version: "2"

linters:
  default: standard # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - bodyclose
    - depguard
    - errorlint
    - gocritic
    - misspell
    - revive
    - unconvert
  settings:
    misspell:
      locale: US
    depguard:
      rules:
        # Clean Architecture (constitution, principle III): the domain knows
        # nothing about frameworks, transport or storage.
        domain:
          files:
            - "**/internal/domain/**"
          deny:
            - pkg: github.com/gin-gonic/gin
              desc: domain must not depend on the HTTP framework
            - pkg: github.com/coder/websocket
              desc: domain must not depend on transport
            - pkg: database/sql
              desc: domain must not depend on storage
            - pkg: raccoons-world/server/internal/usecase
              desc: dependencies point inward
            - pkg: raccoons-world/server/internal/adapter
              desc: dependencies point inward
            - pkg: raccoons-world/server/internal/infra
              desc: dependencies point inward
        # Use cases never receive *gin.Context nor know adapters/infra.
        usecase:
          files:
            - "**/internal/usecase/**"
          deny:
            - pkg: github.com/gin-gonic/gin
              desc: use cases take their own DTOs
            - pkg: github.com/coder/websocket
              desc: use cases must not know the transport
            - pkg: raccoons-world/server/internal/adapter
              desc: dependencies point inward
            - pkg: raccoons-world/server/internal/infra
              desc: dependencies point inward

  exclusions:
    rules:
      # Step patterns must match the Portuguese .feature text verbatim.
      - path: features[\\/].*_steps_test\.go
        linters:
          - misspell

formatters:
  enable:
    - gofmt
    - goimports
